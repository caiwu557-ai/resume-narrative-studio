name: core-tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Core static checks
        run: python tests/test_skill_package.py
      - name: Photo policy checks (static)
        run: python tests/test_photo_policy_v13.py
